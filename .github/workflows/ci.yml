name: Formula CI

on:
  pull_request:
    paths:
      - "Formula/**"
      - "config/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - main
    paths:
      - "Formula/**"
      - "config/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  formula:
    name: Formula (macOS 26 arm64)
    runs-on: macos-26
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read

    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # 2026.08.14.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: macos-26-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: macos-26-rubygems-

      - name: Detect formula
        id: formula
        run: |
          if [ -f Formula/atctl.rb ]; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Formula/atctl.rb does not exist yet; skipping formula checks."
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Clean before test-bot
        run: brew test-bot --only-cleanup-before

      - name: Set up test-bot
        run: brew test-bot --only-setup

      - name: Check tap syntax
        run: brew test-bot --only-tap-syntax

      - name: Build, test, and bottle formulae
        if: steps.formula.outputs.exists == 'true'
        run: brew test-bot --only-formulae --testing-formulae=atctl

      - name: Upload bottles as artifact
        if: always() && steps.formula.outputs.exists == 'true' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottles_macos-26
          path: "*.bottle.*"
          if-no-files-found: error

  request-bottle-publication:
    name: Request bottle publication
    needs: formula
    if: >-
      github.event_name == 'pull_request' &&
      needs.formula.result == 'success' &&
      github.event.pull_request.user.login == 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'formula/')
    runs-on: ubuntu-latest
    permissions:
      # Creating a repository_dispatch event requires Contents: write.
      # This job does not check out or execute pull-request content.
      contents: write
      pull-requests: read

    steps:
      - name: Request publication when enabled
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [[ ! "${PULL_REQUEST}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Formula CI did not receive a valid pull request number."
            exit 1
          fi

          if [[ ! "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Formula CI did not receive a full 40-character lowercase head SHA."
            exit 1
          fi

          if [[ ! "${GITHUB_RUN_ID}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Formula CI did not receive a valid workflow run ID."
            exit 1
          fi

          if [[ "${HEAD_REPOSITORY}" != "${GITHUB_REPOSITORY}" ]]; then
            echo "::error::Bottle publication can only be requested for a Formula branch in ${GITHUB_REPOSITORY}."
            exit 1
          fi

          if [[ ! "${HEAD_BRANCH}" =~ ^formula/[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Unexpected Formula pull request head branch: ${HEAD_BRANCH}"
            exit 1
          fi

          PR_JSON=""
          PR_HEAD_CONFIRMED="false"
          for _ in {1..30}; do
            if PR_JSON="$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST}")" &&
              jq -e \
                --arg default_branch "${DEFAULT_BRANCH}" \
                --arg head_branch "${HEAD_BRANCH}" \
                --arg head_sha "${HEAD_SHA}" \
                --arg repository "${GITHUB_REPOSITORY}" \
                '
                  .state == "open" and
                  .draft == false and
                  .base.ref == $default_branch and
                  .head.ref == $head_branch and
                  .head.sha == $head_sha and
                  .head.repo.full_name == $repository and
                  .user.login == "github-actions[bot]"
                ' <<<"${PR_JSON}" >/dev/null; then
              PR_HEAD_CONFIRMED="true"
              break
            fi
            sleep 2
          done

          if [[ "${PR_HEAD_CONFIRMED}" != "true" ]]; then
            echo "::error::The pull request did not converge to the expected open, non-draft, bot-created Formula PR at ${HEAD_SHA}."
            exit 1
          fi

          CHANGED_FILES="$(
            gh api \
              --paginate \
              "/repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST}/files?per_page=100" \
              --jq '.[].filename'
          )"

          if [[ "${CHANGED_FILES}" != "Formula/atctl.rb" ]]; then
            echo "::error::Bottle publication requires Formula/atctl.rb to be the pull request's only changed file."
            printf '%s\n' "${CHANGED_FILES}"
            exit 1
          fi

          TRUE_MARKER="<!-- homebrew-atctl-publish-bottles=true head_sha=${HEAD_SHA} -->"
          FALSE_MARKER="<!-- homebrew-atctl-publish-bottles=false head_sha=${HEAD_SHA} -->"
          PUBLICATION_SETTING=""

          for _ in {1..30}; do
            PR_JSON="$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST}")"

            if ! jq -e \
              --arg default_branch "${DEFAULT_BRANCH}" \
              --arg head_branch "${HEAD_BRANCH}" \
              --arg head_sha "${HEAD_SHA}" \
              --arg repository "${GITHUB_REPOSITORY}" \
              '
                .state == "open" and
                .draft == false and
                .base.ref == $default_branch and
                .head.ref == $head_branch and
                .head.sha == $head_sha and
                .head.repo.full_name == $repository and
                .user.login == "github-actions[bot]"
              ' <<<"${PR_JSON}" >/dev/null; then
              sleep 2
              continue
            fi

            PR_BODY="$(jq -r '.body // ""' <<<"${PR_JSON}")"
            TRUE_COUNT="$(grep -Fxc -- "${TRUE_MARKER}" <<<"${PR_BODY}" || true)"
            FALSE_COUNT="$(grep -Fxc -- "${FALSE_MARKER}" <<<"${PR_BODY}" || true)"

            if (( TRUE_COUNT > 1 || FALSE_COUNT > 1 || (TRUE_COUNT == 1 && FALSE_COUNT == 1) )); then
              echo "::error::The Formula PR contains an ambiguous publication marker for ${HEAD_SHA}."
              exit 1
            fi

            if [[ "${TRUE_COUNT}" = "1" && "${FALSE_COUNT}" = "0" ]]; then
              PUBLICATION_SETTING="enabled"
              break
            fi

            if [[ "${TRUE_COUNT}" = "0" && "${FALSE_COUNT}" = "1" ]]; then
              PUBLICATION_SETTING="disabled"
              break
            fi

            sleep 2
          done

          if [[ "${PUBLICATION_SETTING}" = "disabled" ]]; then
            {
              echo "## Bottle publication"
              echo
              echo "Automatic bottle publication is **disabled** for pull request #${PULL_REQUEST} at \`${HEAD_SHA}\`."
              echo
              echo "Formula CI succeeded without starting Publish Bottles."
            } >>"${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          if [[ "${PUBLICATION_SETTING}" != "enabled" ]]; then
            echo "::error::The Formula PR did not expose exactly one publication setting for ${HEAD_SHA}."
            exit 1
          fi

          DISPATCH_PAYLOAD="$(
            jq -cn \
              --arg head_sha "${HEAD_SHA}" \
              --argjson formula_ci_run_id "${GITHUB_RUN_ID}" \
              --argjson pull_request "${PULL_REQUEST}" \
              '{
                event_type: "publish-bottles",
                client_payload: {
                  pull_request: $pull_request,
                  head_sha: $head_sha,
                  formula_ci_run_id: $formula_ci_run_id
                }
              }'
          )"

          gh api \
            --method POST \
            "/repos/${GITHUB_REPOSITORY}/dispatches" \
            --input - <<<"${DISPATCH_PAYLOAD}"

          {
            echo "## Bottle publication"
            echo
            echo "Requested **Publish Bottles** for pull request #${PULL_REQUEST} at \`${HEAD_SHA}\`."
            echo
            echo "Formula CI run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >>"${GITHUB_STEP_SUMMARY}"
