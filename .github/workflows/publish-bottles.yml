name: Publish Bottles

run-name: >-
  Publish bottles for PR #${{ github.event_name == 'workflow_dispatch' && inputs.pull_request || github.event_name == 'pull_request_review' && github.event.pull_request.number || github.event_name == 'workflow_run' && github.event.workflow_run.pull_requests[0].number || github.event.client_payload.pull_request || github.run_id }}
  (${{ github.event_name == 'workflow_dispatch' && 'manual' || github.event_name == 'pull_request_review' && 'PR approval' || github.event_name == 'workflow_run' && 'Formula CI completion' || 'automatic' }})

on:
  pull_request_review:
    types:
      - submitted
  workflow_run:
    workflows:
      - Formula CI
    types:
      - completed
    branches:
      - "formula/**"
  repository_dispatch:
    types:
      - publish-bottles
  workflow_dispatch:
    inputs:
      pull_request:
        description: "PR number shown in the generated Formula PR's Bottle publication section"
        required: true
        type: string
      head_sha:
        description: "Full 40-character head SHA shown in that reviewed PR section"
        required: true
        type: string

concurrency:
  group: >-
    bottle-publication-pr-${{ github.event_name == 'workflow_dispatch' && inputs.pull_request || github.event_name == 'pull_request_review' && github.event.pull_request.number || github.event_name == 'workflow_run' && github.event.workflow_run.pull_requests[0].number || github.event.client_payload.pull_request || github.run_id }}
  cancel-in-progress: false

permissions: {}

jobs:
  request-automatic-publication:
    if: >-
      (github.event_name == 'pull_request_review' &&
      github.event.review.state == 'approved' &&
      github.event.review.user.login == github.repository_owner) ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: read

    steps:
      - name: Request publication when CI and approval are complete
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_PULL_REQUEST: ${{ github.event.pull_request.number }}
          EVENT_REVIEW_COMMIT_ID: ${{ github.event.review.commit_id }}
          EVENT_REVIEW_ID: ${{ github.event.review.id }}
          EVENT_REVIEW_STATE: ${{ github.event.review.state }}
          EVENT_REVIEWER: ${{ github.event.review.user.login }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          WORKFLOW_RUN_ACTOR: ${{ github.event.workflow_run.actor.login }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_RUN_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_RUN_PULL_REQUEST: ${{ github.event.workflow_run.pull_requests[0].number }}
          WORKFLOW_RUN_STATUS: ${{ github.event.workflow_run.status }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" = "pull_request_review" ]]; then
            HEAD_BRANCH="${EVENT_HEAD_BRANCH}"
            HEAD_REPOSITORY="${EVENT_HEAD_REPOSITORY}"
            HEAD_SHA="${EVENT_HEAD_SHA}"
            PULL_REQUEST="${EVENT_PULL_REQUEST}"
            REVIEW_ID="${EVENT_REVIEW_ID}"

            if [[ "${EVENT_REVIEW_STATE}" != "approved" || "${EVENT_REVIEWER}" != "${REPOSITORY_OWNER}" ]]; then
              echo "::error::Bottle publication requires an approving review from ${REPOSITORY_OWNER}."
              exit 1
            fi

            if [[ ! "${REVIEW_ID}" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::The approval event did not contain a valid review ID."
              exit 1
            fi

            if [[ ! "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ || "${EVENT_REVIEW_COMMIT_ID}" != "${HEAD_SHA}" ]]; then
              echo "::error::The approval does not identify the current full Formula pull request head SHA."
              exit 1
            fi
          elif [[ "${EVENT_NAME}" = "workflow_run" ]]; then
            HEAD_BRANCH="${WORKFLOW_RUN_HEAD_BRANCH}"
            HEAD_REPOSITORY="${WORKFLOW_RUN_HEAD_REPOSITORY}"
            HEAD_SHA="${WORKFLOW_RUN_HEAD_SHA}"
            PULL_REQUEST="${WORKFLOW_RUN_PULL_REQUEST}"
            REVIEW_ID=""

            if [[ "${WORKFLOW_RUN_NAME}" != "Formula CI" ||
              "${WORKFLOW_RUN_EVENT}" != "pull_request" ||
              "${WORKFLOW_RUN_STATUS}" != "completed" ||
              "${WORKFLOW_RUN_CONCLUSION}" != "success" ||
              "${WORKFLOW_RUN_ACTOR}" != "github-actions[bot]" ||
              ! "${WORKFLOW_RUN_ID}" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::The workflow completion event is not a successful bot-triggered Formula CI pull request run."
              exit 1
            fi
          else
            echo "::error::Unexpected automatic publication event: ${EVENT_NAME}"
            exit 1
          fi

          if [[ ! "${PULL_REQUEST}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::The automatic publication event did not contain a valid pull request number."
            exit 1
          fi

          if [[ ! "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The automatic publication event did not contain a full 40-character lowercase head SHA."
            exit 1
          fi

          PR_JSON="$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST}")"
          PR_STATE="$(jq -r '.state' <<<"${PR_JSON}")"
          CURRENT_HEAD_SHA="$(jq -r '.head.sha' <<<"${PR_JSON}")"

          if [[ "${PR_STATE}" != "open" || "${CURRENT_HEAD_SHA}" != "${HEAD_SHA}" ]]; then
            {
              echo "## Bottle publication"
              echo
              echo "The automatic signal for pull request #${PULL_REQUEST} at \`${HEAD_SHA}\` is stale because the pull request is closed or now has a different head."
              echo
              echo "No publication was requested."
            } >>"${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          if [[ "${HEAD_REPOSITORY}" != "${GITHUB_REPOSITORY}" || ! "${HEAD_BRANCH}" =~ ^formula/[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Bottle publication can only be requested for a Formula branch in ${GITHUB_REPOSITORY}."
            exit 1
          fi

          if ! jq -e \
            --arg default_branch "${DEFAULT_BRANCH}" \
            --arg head_branch "${HEAD_BRANCH}" \
            --arg head_sha "${HEAD_SHA}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            '
              .state == "open" and
              .draft == false and
              .base.ref == $default_branch and
              .head.ref == $head_branch and
              .head.sha == $head_sha and
              .head.repo.full_name == $repository and
              .user.login == "github-actions[bot]"
            ' <<<"${PR_JSON}" >/dev/null; then
            echo "::error::The pull request is not the expected open, non-draft, bot-created Formula PR at ${HEAD_SHA}."
            exit 1
          fi

          CHANGED_FILES="$(
            gh api \
              --paginate \
              "/repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST}/files?per_page=100" \
              --jq '.[].filename'
          )"

          if [[ "${CHANGED_FILES}" != "Formula/atctl.rb" ]]; then
            echo "::error::Bottle publication requires Formula/atctl.rb to be the pull request's only changed file."
            printf '%s\n' "${CHANGED_FILES}"
            exit 1
          fi

          PR_BODY="$(jq -r '.body // ""' <<<"${PR_JSON}")"
          TRUE_MARKER="<!-- homebrew-atctl-publish-bottles=true head_sha=${HEAD_SHA} -->"
          FALSE_MARKER="<!-- homebrew-atctl-publish-bottles=false head_sha=${HEAD_SHA} -->"
          TRUE_COUNT="$(grep -Fxc -- "${TRUE_MARKER}" <<<"${PR_BODY}" || true)"
          FALSE_COUNT="$(grep -Fxc -- "${FALSE_MARKER}" <<<"${PR_BODY}" || true)"

          if [[ "${TRUE_COUNT}" = "0" && "${FALSE_COUNT}" = "1" ]]; then
            {
              echo "## Bottle publication"
              echo
              echo "Automatic bottle publication is **disabled** for pull request #${PULL_REQUEST} at \`${HEAD_SHA}\`."
              echo
              echo "Neither PR approval nor Formula CI completion will start publication for this request."
            } >>"${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          if [[ "${TRUE_COUNT}" != "1" || "${FALSE_COUNT}" != "0" ]]; then
            echo "::error::The Formula PR does not contain exactly one enabled publication marker for ${HEAD_SHA}."
            exit 1
          fi

          REVIEWS_JSON="$(
            gh api \
              --paginate \
              --slurp \
              "/repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST}/reviews?per_page=100"
          )"
          LATEST_OWNER_REVIEW="$(
            jq -c \
              --arg repository_owner "${REPOSITORY_OWNER}" \
              '
                [
                  .[][]
                  | select(
                      .user.login == $repository_owner and
                      .state != "COMMENTED"
                    )
                ]
                | last // {}
              ' <<<"${REVIEWS_JSON}"
          )"

          if ! jq -e \
            --arg head_sha "${HEAD_SHA}" \
            --arg repository_owner "${REPOSITORY_OWNER}" \
            '
              .state == "APPROVED" and
              .commit_id == $head_sha and
              .user.login == $repository_owner and
              (.id | type == "number")
            ' <<<"${LATEST_OWNER_REVIEW}" >/dev/null; then
            if [[ "${EVENT_NAME}" = "workflow_run" ]]; then
              {
                echo "## Bottle publication"
                echo
                echo "Formula CI succeeded for pull request #${PULL_REQUEST} at \`${HEAD_SHA}\`."
                echo
                echo "Automatic publication is enabled. Approve this exact pull request head to publish the bottles and update \`main\`."
              } >>"${GITHUB_STEP_SUMMARY}"
              exit 0
            fi

            {
              echo "## Bottle publication"
              echo
              echo "The approval event for pull request #${PULL_REQUEST} is no longer the repository owner's current approval for \`${HEAD_SHA}\`."
              echo
              echo "No publication was requested."
            } >>"${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          LATEST_REVIEW_ID="$(jq -r '.id' <<<"${LATEST_OWNER_REVIEW}")"

          if [[ ! "${LATEST_REVIEW_ID}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::GitHub returned an invalid approval review ID: ${LATEST_REVIEW_ID}"
            exit 1
          fi

          if [[ "${EVENT_NAME}" = "pull_request_review" && "${LATEST_REVIEW_ID}" != "${REVIEW_ID}" ]]; then
            {
              echo "## Bottle publication"
              echo
              echo "A newer repository-owner review superseded approval ${REVIEW_ID} for \`${HEAD_SHA}\`."
              echo
              echo "No publication was requested by this stale approval event."
            } >>"${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          REVIEW_ID="${LATEST_REVIEW_ID}"

          if [[ "${EVENT_NAME}" = "workflow_run" ]]; then
            FORMULA_CI_RUN_ID="${WORKFLOW_RUN_ID}"
          else
            CI_RUNS_JSON="$(
              gh api \
                --method GET \
                "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
                -f event=pull_request \
                -f head_sha="${HEAD_SHA}" \
                -f status=success \
                -F per_page=100
            )"
            FORMULA_CI_RUN_ID="$(
              jq -r \
                --arg head_branch "${HEAD_BRANCH}" \
                --arg head_sha "${HEAD_SHA}" \
                --arg repository "${GITHUB_REPOSITORY}" \
                --argjson pull_request "${PULL_REQUEST}" \
                '
                  [
                    .workflow_runs[]?
                    | select(
                        .name == "Formula CI" and
                        ((.path // "" | split("@")[0]) == ".github/workflows/ci.yml") and
                        .event == "pull_request" and
                        .status == "completed" and
                        .conclusion == "success" and
                        .head_branch == $head_branch and
                        .head_sha == $head_sha and
                        .head_repository.full_name == $repository and
                        .actor.login == "github-actions[bot]" and
                        any(.pull_requests[]?; .number == $pull_request)
                      )
                  ]
                  | sort_by(.updated_at)
                  | last
                  | .id // empty
                ' <<<"${CI_RUNS_JSON}"
            )"

            if [[ -z "${FORMULA_CI_RUN_ID}" ]]; then
              {
                echo "## Bottle publication approval"
                echo
                echo "Pull request #${PULL_REQUEST} is approved at \`${HEAD_SHA}\`."
                echo
                echo "Formula CI has not succeeded for this exact head. Its successful completion will start publication automatically."
              } >>"${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
          fi

          if [[ ! "${FORMULA_CI_RUN_ID}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::GitHub returned an invalid Formula CI run ID: ${FORMULA_CI_RUN_ID}"
            exit 1
          fi

          CI_RUN_JSON="$(
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${FORMULA_CI_RUN_ID}"
          )"

          if ! jq -e \
            --arg head_branch "${HEAD_BRANCH}" \
            --arg head_sha "${HEAD_SHA}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --argjson pull_request "${PULL_REQUEST}" \
            '
              .name == "Formula CI" and
              ((.path // "" | split("@")[0]) == ".github/workflows/ci.yml") and
              .event == "pull_request" and
              .status == "completed" and
              .conclusion == "success" and
              .head_branch == $head_branch and
              .head_sha == $head_sha and
              .head_repository.full_name == $repository and
              .actor.login == "github-actions[bot]" and
              any(.pull_requests[]?; .number == $pull_request)
            ' <<<"${CI_RUN_JSON}" >/dev/null; then
            echo "::error::Run ${FORMULA_CI_RUN_ID} is not the successful Formula CI run for pull request #${PULL_REQUEST} at ${HEAD_SHA}."
            exit 1
          fi

          ARTIFACT_READY="false"
          for _ in {1..15}; do
            ARTIFACTS_JSON="$(
              gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${FORMULA_CI_RUN_ID}/artifacts?per_page=100"
            )"

            if jq -e \
              --arg head_sha "${HEAD_SHA}" \
              '
                any(
                  .artifacts[]?;
                  .name == "bottles_macos-26" and
                  .expired == false and
                  .size_in_bytes > 0 and
                  .workflow_run.head_sha == $head_sha
                )
              ' <<<"${ARTIFACTS_JSON}" >/dev/null; then
              ARTIFACT_READY="true"
              break
            fi

            sleep 2
          done

          if [[ "${ARTIFACT_READY}" != "true" ]]; then
            echo "::error::Formula CI run ${FORMULA_CI_RUN_ID} has no usable bottles_macos-26 artifact for ${HEAD_SHA}."
            exit 1
          fi

          DISPATCH_PAYLOAD="$(
            jq -cn \
              --arg head_sha "${HEAD_SHA}" \
              --argjson formula_ci_run_id "${FORMULA_CI_RUN_ID}" \
              --argjson pull_request "${PULL_REQUEST}" \
              --argjson review_id "${REVIEW_ID}" \
              '{
                event_type: "publish-bottles",
                client_payload: {
                  pull_request: $pull_request,
                  head_sha: $head_sha,
                  formula_ci_run_id: $formula_ci_run_id,
                  review_id: $review_id
                }
              }'
          )"

          gh api \
            --method POST \
            "/repos/${GITHUB_REPOSITORY}/dispatches" \
            --input - <<<"${DISPATCH_PAYLOAD}"

          {
            echo "## Bottle publication approval"
            echo
            echo "Approved pull request: https://github.com/${GITHUB_REPOSITORY}/pull/${PULL_REQUEST}"
            echo
            echo "Approved head: \`${HEAD_SHA}\`"
            echo
            echo "Formula CI run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${FORMULA_CI_RUN_ID}"
            echo
            echo "Requested **Publish Bottles**. No further approval is required."
          } >>"${GITHUB_STEP_SUMMARY}"

  prepare-publication:
    if: github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      formula_ci_run_id: ${{ steps.publication.outputs.formula_ci_run_id }}
      head_sha: ${{ steps.publication.outputs.head_sha }}
      pull_request: ${{ steps.publication.outputs.pull_request }}
      ready: ${{ steps.publication.outputs.ready }}
      review_id: ${{ steps.publication.outputs.review_id }}
      source: ${{ steps.publication.outputs.source }}

    steps:
      - name: Resolve and validate publication request
        id: publication
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DISPATCH_HEAD_SHA: ${{ inputs.head_sha }}
          DISPATCH_PULL_REQUEST: ${{ inputs.pull_request }}
          EVENT_NAME: ${{ github.event_name }}
          FORMULA_CI_RUN_ID: ${{ github.event.client_payload.formula_ci_run_id }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_DISPATCH_ACTION: ${{ github.event.action }}
          REPOSITORY_DISPATCH_HEAD_SHA: ${{ github.event.client_payload.head_sha }}
          REPOSITORY_DISPATCH_PULL_REQUEST: ${{ github.event.client_payload.pull_request }}
          REPOSITORY_DISPATCH_REVIEW_ID: ${{ github.event.client_payload.review_id }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" != "refs/heads/${DEFAULT_BRANCH}" ]]; then
            echo "::error::Publish Bottles must run from the repository default branch ${DEFAULT_BRANCH}."
            exit 1
          fi

          if [[ "${EVENT_NAME}" = "workflow_dispatch" ]]; then
            SOURCE="manual"
            PULL_REQUEST="${DISPATCH_PULL_REQUEST}"
            HEAD_SHA="${DISPATCH_HEAD_SHA}"
            FORMULA_CI_RUN_ID=""
            REVIEW_ID=""
          elif [[ "${EVENT_NAME}" = "repository_dispatch" ]]; then
            SOURCE="automatic"
            PULL_REQUEST="${REPOSITORY_DISPATCH_PULL_REQUEST}"
            HEAD_SHA="${REPOSITORY_DISPATCH_HEAD_SHA}"
            REVIEW_ID="${REPOSITORY_DISPATCH_REVIEW_ID}"

            if [[ "${REPOSITORY_DISPATCH_ACTION}" != "publish-bottles" ]]; then
              echo "::error::Unexpected repository_dispatch action: ${REPOSITORY_DISPATCH_ACTION}"
              exit 1
            fi
          else
            echo "::error::Unexpected publication event: ${EVENT_NAME}"
            exit 1
          fi

          write_outputs() {
            {
              echo "formula_ci_run_id=${FORMULA_CI_RUN_ID}"
              echo "head_sha=${HEAD_SHA}"
              echo "pull_request=${PULL_REQUEST}"
              echo "ready=${READY}"
              echo "review_id=${REVIEW_ID}"
              echo "source=${SOURCE}"
            } >>"${GITHUB_OUTPUT}"
          }

          READY="false"

          if [[ ! "${PULL_REQUEST}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::pull_request must be a positive pull request number without a leading #."
            exit 1
          fi

          if [[ ! "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::head_sha must be the full 40-character lowercase Git commit SHA from the reviewed Formula PR."
            exit 1
          fi

          if [[ "${SOURCE}" = "automatic" ]]; then
            if [[ ! "${FORMULA_CI_RUN_ID}" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Automatic publication requires a valid Formula CI run ID."
              exit 1
            fi

            if [[ ! "${REVIEW_ID}" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Automatic publication requires a valid approving review ID."
              exit 1
            fi
          fi

          PR_JSON="$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST}")"
          PR_STATE="$(jq -r '.state' <<<"${PR_JSON}")"
          PR_HEAD_BRANCH="$(jq -r '.head.ref' <<<"${PR_JSON}")"

          if [[ "${SOURCE}" = "automatic" && "${PR_STATE}" != "open" ]]; then
            write_outputs
            {
              echo "## Bottle publication"
              echo
              echo "Pull request #${PULL_REQUEST} is no longer open. This duplicate or stale automatic publication request did not run."
            } >>"${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          if [[ ! "${PR_HEAD_BRANCH}" =~ ^formula/[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Unexpected pull request head branch: ${PR_HEAD_BRANCH}"
            exit 1
          fi

          if ! jq -e \
            --arg default_branch "${DEFAULT_BRANCH}" \
            --arg head_sha "${HEAD_SHA}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            '
              .state == "open" and
              .draft == false and
              .base.ref == $default_branch and
              .head.sha == $head_sha and
              .head.repo.full_name == $repository and
              .user.login == "github-actions[bot]"
            ' <<<"${PR_JSON}" >/dev/null; then
            echo "::error::The pull request is not the expected open, non-draft, bot-created Formula PR at ${HEAD_SHA}."
            exit 1
          fi

          CHANGED_FILES="$(
            gh api \
              --paginate \
              "/repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST}/files?per_page=100" \
              --jq '.[].filename'
          )"

          if [[ "${CHANGED_FILES}" != "Formula/atctl.rb" ]]; then
            echo "::error::Publication requires Formula/atctl.rb to be the pull request's only changed file."
            printf '%s\n' "${CHANGED_FILES}"
            exit 1
          fi

          if [[ "${SOURCE}" = "automatic" ]]; then
            PR_BODY="$(jq -r '.body // ""' <<<"${PR_JSON}")"
            TRUE_MARKER="<!-- homebrew-atctl-publish-bottles=true head_sha=${HEAD_SHA} -->"
            FALSE_MARKER="<!-- homebrew-atctl-publish-bottles=false head_sha=${HEAD_SHA} -->"
            TRUE_COUNT="$(grep -Fxc -- "${TRUE_MARKER}" <<<"${PR_BODY}" || true)"
            FALSE_COUNT="$(grep -Fxc -- "${FALSE_MARKER}" <<<"${PR_BODY}" || true)"

            if [[ "${TRUE_COUNT}" = "0" && "${FALSE_COUNT}" = "1" ]]; then
              write_outputs
              {
                echo "## Bottle publication"
                echo
                echo "Automatic bottle publication was disabled before pull request #${PULL_REQUEST} could be published."
              } >>"${GITHUB_STEP_SUMMARY}"
              exit 0
            fi

            if [[ "${TRUE_COUNT}" != "1" || "${FALSE_COUNT}" != "0" ]]; then
              echo "::error::Automatic bottle publication is not unambiguously enabled for ${HEAD_SHA}."
              exit 1
            fi

            APPROVAL_JSON="$(
              gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST}/reviews/${REVIEW_ID}"
            )"

            if ! jq -e \
              --arg head_sha "${HEAD_SHA}" \
              --arg repository_owner "${REPOSITORY_OWNER}" \
              --argjson review_id "${REVIEW_ID}" \
              '
                .id == $review_id and
                .state == "APPROVED" and
                .commit_id == $head_sha and
                .user.login == $repository_owner
              ' <<<"${APPROVAL_JSON}" >/dev/null; then
              echo "::error::Review ${REVIEW_ID} is not the repository owner's current approval for ${HEAD_SHA}."
              exit 1
            fi

            REVIEWS_JSON="$(
              gh api \
                --paginate \
                --slurp \
                "/repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST}/reviews?per_page=100"
            )"
            LATEST_OWNER_REVIEW="$(
              jq -c \
                --arg repository_owner "${REPOSITORY_OWNER}" \
                '
                  [
                    .[][]
                    | select(
                        .user.login == $repository_owner and
                        .state != "COMMENTED"
                      )
                  ]
                  | last // {}
                ' <<<"${REVIEWS_JSON}"
            )"

            if ! jq -e \
              --arg head_sha "${HEAD_SHA}" \
              --arg repository_owner "${REPOSITORY_OWNER}" \
              --argjson review_id "${REVIEW_ID}" \
              '
                .id == $review_id and
                .state == "APPROVED" and
                .commit_id == $head_sha and
                .user.login == $repository_owner
              ' <<<"${LATEST_OWNER_REVIEW}" >/dev/null; then
              echo "::error::Review ${REVIEW_ID} is no longer the latest owner decision for ${HEAD_SHA}."
              exit 1
            fi

            CI_RUN_JSON="$(
              gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${FORMULA_CI_RUN_ID}"
            )"

            if ! jq -e \
              --arg head_branch "${PR_HEAD_BRANCH}" \
              --arg head_sha "${HEAD_SHA}" \
              --arg repository "${GITHUB_REPOSITORY}" \
              --argjson pull_request "${PULL_REQUEST}" \
              '
                .name == "Formula CI" and
                ((.path // "" | split("@")[0]) == ".github/workflows/ci.yml") and
                .event == "pull_request" and
                .status == "completed" and
                .conclusion == "success" and
                .head_branch == $head_branch and
                .head_sha == $head_sha and
                .head_repository.full_name == $repository and
                .actor.login == "github-actions[bot]" and
                any(.pull_requests[]?; .number == $pull_request)
              ' <<<"${CI_RUN_JSON}" >/dev/null; then
              echo "::error::Run ${FORMULA_CI_RUN_ID} is not the successful Formula CI run for pull request #${PULL_REQUEST} at ${HEAD_SHA}."
              exit 1
            fi

            ARTIFACTS_JSON="$(
              gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${FORMULA_CI_RUN_ID}/artifacts?per_page=100"
            )"

            if ! jq -e \
              --arg head_sha "${HEAD_SHA}" \
              '
                any(
                  .artifacts[]?;
                  .name == "bottles_macos-26" and
                  .expired == false and
                  .size_in_bytes > 0 and
                  .workflow_run.head_sha == $head_sha
                )
              ' <<<"${ARTIFACTS_JSON}" >/dev/null; then
              echo "::error::Formula CI run ${FORMULA_CI_RUN_ID} has no usable bottles_macos-26 artifact for ${HEAD_SHA}."
              exit 1
            fi
          fi

          READY="true"
          write_outputs

          {
            echo "## Bottle publication request"
            echo
            echo "Pull request: https://github.com/${GITHUB_REPOSITORY}/pull/${PULL_REQUEST}"
            echo
            echo "Reviewed head: \`${HEAD_SHA}\`"
            echo
            echo "Publication source: **${SOURCE}**"
            if [[ "${SOURCE}" = "automatic" ]]; then
              echo
              echo "Formula CI run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${FORMULA_CI_RUN_ID}"
              echo
              echo "Approval: https://github.com/${GITHUB_REPOSITORY}/pull/${PULL_REQUEST}#pullrequestreview-${REVIEW_ID}"
            fi
          } >>"${GITHUB_STEP_SUMMARY}"

  publish-bottles:
    needs: prepare-publication
    if: >-
      needs.prepare-publication.result == 'success' &&
      needs.prepare-publication.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: write
      issues: read
      pull-requests: write

    steps:
      - name: Revalidate publication
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FORMULA_CI_RUN_ID: ${{ needs.prepare-publication.outputs.formula_ci_run_id }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.prepare-publication.outputs.head_sha }}
          PUBLICATION_SOURCE: ${{ needs.prepare-publication.outputs.source }}
          PULL_REQUEST: ${{ needs.prepare-publication.outputs.pull_request }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REVIEW_ID: ${{ needs.prepare-publication.outputs.review_id }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" != "refs/heads/${DEFAULT_BRANCH}" ]]; then
            echo "::error::Publish Bottles must run from the repository default branch ${DEFAULT_BRANCH}."
            exit 1
          fi

          if [[ ! "${PULL_REQUEST}" =~ ^[1-9][0-9]*$ || ! "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The prepared publication identifiers are invalid."
            exit 1
          fi

          if [[ "${PUBLICATION_SOURCE}" != "automatic" && "${PUBLICATION_SOURCE}" != "manual" ]]; then
            echo "::error::Unexpected publication source: ${PUBLICATION_SOURCE}"
            exit 1
          fi

          PR_JSON="$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST}")"
          PR_HEAD_BRANCH="$(jq -r '.head.ref' <<<"${PR_JSON}")"

          if [[ ! "${PR_HEAD_BRANCH}" =~ ^formula/[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Unexpected pull request head branch: ${PR_HEAD_BRANCH}"
            exit 1
          fi

          if ! jq -e \
            --arg default_branch "${DEFAULT_BRANCH}" \
            --arg head_sha "${HEAD_SHA}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            '
              .state == "open" and
              .draft == false and
              .base.ref == $default_branch and
              .head.sha == $head_sha and
              .head.repo.full_name == $repository and
              .user.login == "github-actions[bot]"
            ' <<<"${PR_JSON}" >/dev/null; then
            echo "::error::The pull request no longer matches the reviewed Formula PR at ${HEAD_SHA}."
            exit 1
          fi

          CHANGED_FILES="$(
            gh api \
              --paginate \
              "/repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST}/files?per_page=100" \
              --jq '.[].filename'
          )"

          if [[ "${CHANGED_FILES}" != "Formula/atctl.rb" ]]; then
            echo "::error::Publication requires Formula/atctl.rb to remain the pull request's only changed file."
            printf '%s\n' "${CHANGED_FILES}"
            exit 1
          fi

          if [[ "${PUBLICATION_SOURCE}" = "automatic" ]]; then
            if [[ ! "${FORMULA_CI_RUN_ID}" =~ ^[1-9][0-9]*$ || ! "${REVIEW_ID}" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Automatic publication lost its Formula CI or approval identifier."
              exit 1
            fi

            PR_BODY="$(jq -r '.body // ""' <<<"${PR_JSON}")"
            TRUE_MARKER="<!-- homebrew-atctl-publish-bottles=true head_sha=${HEAD_SHA} -->"
            FALSE_MARKER="<!-- homebrew-atctl-publish-bottles=false head_sha=${HEAD_SHA} -->"
            TRUE_COUNT="$(grep -Fxc -- "${TRUE_MARKER}" <<<"${PR_BODY}" || true)"
            FALSE_COUNT="$(grep -Fxc -- "${FALSE_MARKER}" <<<"${PR_BODY}" || true)"

            if [[ "${TRUE_COUNT}" != "1" || "${FALSE_COUNT}" != "0" ]]; then
              echo "::error::Automatic bottle publication is no longer enabled for the approved pull request head."
              exit 1
            fi

            APPROVAL_JSON="$(
              gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST}/reviews/${REVIEW_ID}"
            )"
            REVIEWS_JSON="$(
              gh api \
                --paginate \
                --slurp \
                "/repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST}/reviews?per_page=100"
            )"
            LATEST_OWNER_REVIEW="$(
              jq -c \
                --arg repository_owner "${REPOSITORY_OWNER}" \
                '
                  [
                    .[][]
                    | select(
                        .user.login == $repository_owner and
                        .state != "COMMENTED"
                      )
                  ]
                  | last // {}
                ' <<<"${REVIEWS_JSON}"
            )"

            for REVIEW_JSON in "${APPROVAL_JSON}" "${LATEST_OWNER_REVIEW}"; do
              if ! jq -e \
                --arg head_sha "${HEAD_SHA}" \
                --arg repository_owner "${REPOSITORY_OWNER}" \
                --argjson review_id "${REVIEW_ID}" \
                '
                  .id == $review_id and
                  .state == "APPROVED" and
                  .commit_id == $head_sha and
                  .user.login == $repository_owner
                ' <<<"${REVIEW_JSON}" >/dev/null; then
                echo "::error::The repository owner's approval is no longer valid for ${HEAD_SHA}."
                exit 1
              fi
            done

            CI_RUN_JSON="$(
              gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${FORMULA_CI_RUN_ID}"
            )"

            if ! jq -e \
              --arg head_branch "${PR_HEAD_BRANCH}" \
              --arg head_sha "${HEAD_SHA}" \
              --arg repository "${GITHUB_REPOSITORY}" \
              --argjson pull_request "${PULL_REQUEST}" \
              '
                .name == "Formula CI" and
                ((.path // "" | split("@")[0]) == ".github/workflows/ci.yml") and
                .event == "pull_request" and
                .status == "completed" and
                .conclusion == "success" and
                .head_branch == $head_branch and
                .head_sha == $head_sha and
                .head_repository.full_name == $repository and
                .actor.login == "github-actions[bot]" and
                any(.pull_requests[]?; .number == $pull_request)
              ' <<<"${CI_RUN_JSON}" >/dev/null; then
              echo "::error::The approved Formula CI run is no longer valid for pull request #${PULL_REQUEST} at ${HEAD_SHA}."
              exit 1
            fi

            ARTIFACTS_JSON="$(
              gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${FORMULA_CI_RUN_ID}/artifacts?per_page=100"
            )"

            if ! jq -e \
              --arg head_sha "${HEAD_SHA}" \
              '
                any(
                  .artifacts[]?;
                  .name == "bottles_macos-26" and
                  .expired == false and
                  .size_in_bytes > 0 and
                  .workflow_run.head_sha == $head_sha
                )
              ' <<<"${ARTIFACTS_JSON}" >/dev/null; then
              echo "::error::The approved Formula CI bottles are no longer available for ${HEAD_SHA}."
              exit 1
            fi
          fi

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # 2026.08.14.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Git author
        uses: Homebrew/actions/git-user-config@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # 2026.08.14.1

      - name: Publish reviewed bottles
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ needs.prepare-publication.outputs.head_sha }}
          PULL_REQUEST: ${{ needs.prepare-publication.outputs.pull_request }}
        run: |
          brew pr-pull --debug \
            --tap="$GITHUB_REPOSITORY" \
            --workflows=ci.yml \
            --head-sha="$HEAD_SHA" \
            "$PULL_REQUEST"

      - name: Push bottle commit
        uses: Homebrew/actions/git-try-push@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # 2026.08.14.1
        with:
          branch: main
