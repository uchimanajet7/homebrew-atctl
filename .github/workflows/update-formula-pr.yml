name: Update Formula PR

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag from uchimanajet7/atctl, for example v0.1.0"
        required: true
        type: string
      publish_bottles:
        description: "Publish bottles after Formula CI succeeds"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  update-formula:
    runs-on: macos-26

    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # 2026.08.14.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update formula from release tag
        run: ruby scripts/update-formula.rb --tag "${{ inputs.tag }}"

      - name: Show formula changes
        run: |
          git status --short -- Formula/atctl.rb
          git diff -- Formula/atctl.rb

      - name: Check formula style
        run: brew style Formula/atctl.rb

      - name: Audit formula
        run: brew audit --strict --online atctl

      - name: Create or update formula pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_BOTTLES: ${{ inputs.publish_bottles }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          case "${PUBLISH_BOTTLES}" in
            true|false)
              ;;
            *)
              echo "::error::publish_bottles must be true or false."
              exit 1
              ;;
          esac

          SAFE_TAG="${RELEASE_TAG//[^A-Za-z0-9._-]/-}"
          BRANCH="formula/${SAFE_TAG}"
          REMOTE_BRANCH_REF="refs/heads/${BRANCH}"

          PR_COUNT="$(
            gh pr list \
              --state open \
              --base "${GITHUB_REF_NAME}" \
              --head "${BRANCH}" \
              --limit 2 \
              --json number \
              --jq 'length'
          )"

          if [ -n "$(git status --short -- Formula/atctl.rb)" ]; then
            git checkout -B "${BRANCH}"
            git add Formula/atctl.rb
            git commit -m "Update atctl formula to ${RELEASE_TAG}"
            REMOTE_BRANCH_SHA="$(
              git ls-remote --heads origin "${REMOTE_BRANCH_REF}" |
                awk 'NR == 1 { print $1 }'
            )"
            git push \
              --force-with-lease="${REMOTE_BRANCH_REF}:${REMOTE_BRANCH_SHA}" \
              origin \
              "${BRANCH}:${REMOTE_BRANCH_REF}"
          elif [ "${PR_COUNT}" -eq 0 ]; then
            {
              echo "## Formula update"
              echo
              echo "\`Formula/atctl.rb\` is already up to date for ${RELEASE_TAG}; no open ${BRANCH} pull request requires synchronization."
            } >>"${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          case "${PR_COUNT}" in
            0)
              PR_URL="$(
                gh pr create \
                  --base "${GITHUB_REF_NAME}" \
                  --head "${BRANCH}" \
                  --title "Update atctl formula to ${RELEASE_TAG}" \
                  --body "Updates Formula/atctl.rb for uchimanajet7/atctl ${RELEASE_TAG} using scripts/update-formula.rb."
              )"
              ;;
            1)
              PR_URL="$(
                gh pr list \
                  --state open \
                  --base "${GITHUB_REF_NAME}" \
                  --head "${BRANCH}" \
                  --limit 1 \
                  --json url \
                  --jq '.[0].url'
              )"
              ;;
            *)
              echo "::error::Found ${PR_COUNT} open pull requests for ${BRANCH}; expected at most one."
              exit 1
              ;;
          esac

          PR_NUMBER="$(gh pr view "${PR_URL}" --json number --jq '.number')"
          PR_HEAD_SHA="$(gh pr view "${PR_URL}" --json headRefOid --jq '.headRefOid')"

          if [[ ! "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::GitHub returned an invalid pull request number: ${PR_NUMBER}"
            exit 1
          fi

          if [[ ! "${PR_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::GitHub returned an invalid pull request head SHA: ${PR_HEAD_SHA}"
            exit 1
          fi

          PUBLISH_URL="https://github.com/${GITHUB_REPOSITORY}/actions/workflows/publish-bottles.yml"
          HANDOFF_FILE="$(mktemp)"
          PR_BODY_FILE="$(mktemp)"
          trap 'rm -f "${HANDOFF_FILE}" "${PR_BODY_FILE}"' EXIT

          {
            echo "## Bottle publication"
            echo
            if [ "${PUBLISH_BOTTLES}" = "true" ]; then
              echo "Automatic bottle publication: **Enabled**"
              echo
              echo "After **Formula CI** succeeds for this exact head, **Publish Bottles** starts automatically and waits for approval in the \`homebrew-publication\` environment. Review that deployment and select **Approve and deploy** to publish the bottles and update \`main\`."
              echo
              echo "Do not manually merge this pull request before bottle publication."
            else
              echo "Automatic bottle publication: **Disabled**"
              echo
              echo "After **Formula CI** succeeds, no automatic publication approval is requested and no bottles or \`main\` update are published. Merge this pull request manually if bottles are intentionally not required, or use the manual workflow below to publish later."
            fi
            echo
            echo "If GitHub shows **Approve workflows to run**, approve it and wait for **Formula CI** to succeed. This approval only allows CI to run; it does not publish bottles or merge this pull request."
            echo
            echo "### Manual Publish Bottles inputs"
            echo
            echo "The manual workflow remains available independently of the automatic setting. It uses the same publication approval and exact-head validation."
            echo
            echo "| Publish Bottles input | Value |"
            echo "| --- | --- |"
            echo "| \`pull_request\` | \`${PR_NUMBER}\` |"
            echo "| \`head_sha\` | \`${PR_HEAD_SHA}\` |"
            echo
            echo "[Open Publish Bottles](${PUBLISH_URL})"
            echo
            echo "If the pull request head changes, review the new commit and rerun **Update Formula PR** to refresh this handoff. Publication is rejected unless the current pull request head and the reviewed \`brew pr-pull --head-sha\` value still match."
            echo
            echo "<!-- homebrew-atctl-publish-bottles=${PUBLISH_BOTTLES} head_sha=${PR_HEAD_SHA} -->"
          } >"${HANDOFF_FILE}"

          {
            echo "Updates \`Formula/atctl.rb\` for [uchimanajet7/atctl ${RELEASE_TAG}](https://github.com/uchimanajet7/atctl/releases/tag/${RELEASE_TAG}) using \`scripts/update-formula.rb\`."
            echo
            cat "${HANDOFF_FILE}"
          } >"${PR_BODY_FILE}"

          gh pr edit "${PR_URL}" --body-file "${PR_BODY_FILE}"

          {
            echo "## Formula update pull request"
            echo
            echo "Pull request: ${PR_URL}"
            echo
            cat "${HANDOFF_FILE}"
          } >>"${GITHUB_STEP_SUMMARY}"
