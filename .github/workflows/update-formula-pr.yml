name: Update Formula PR

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag from uchimanajet7/atctl, for example v0.1.0"
        required: true
        type: string
      publish_bottles:
        description: "Publish bottles after Formula CI succeeds"
        required: true
        default: true
        type: boolean

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  update-formula:
    runs-on: macos-26

    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@a657b8b0cd35d0f65cce41fce9b24cf054b49869 # 2026.08.24.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update formula from release tag
        run: ruby scripts/update-formula.rb --tag "${{ inputs.tag }}"

      - name: Show formula changes
        run: |
          git status --short -- Formula/atctl.rb
          git diff -- Formula/atctl.rb

      - name: Check formula style
        run: brew style Formula/atctl.rb

      - name: Audit formula
        run: brew audit --strict --online atctl

      - name: Create or update formula pull request
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          PUBLISH_BOTTLES: ${{ inputs.publish_bottles }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          case "${PUBLISH_BOTTLES}" in
            true|false)
              ;;
            *)
              echo "::error::publish_bottles must be true or false."
              exit 1
              ;;
          esac

          if [[ "${GITHUB_REF}" != "refs/heads/${DEFAULT_BRANCH}" ]]; then
            echo "::error::Update Formula PR must run from the repository default branch ${DEFAULT_BRANCH}."
            exit 1
          fi

          if [[ ! "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Update Formula PR did not receive a full 40-character lowercase default-branch SHA."
            exit 1
          fi

          if [[ ! "${GITHUB_RUN_ID}" =~ ^[1-9][0-9]*$ || ! "${GITHUB_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Update Formula PR did not receive valid run identifiers."
            exit 1
          fi

          SAFE_TAG="${RELEASE_TAG//[^A-Za-z0-9._-]/-}"
          BRANCH="formula/${SAFE_TAG}"
          REMOTE_BRANCH_REF="refs/heads/${BRANCH}"

          PR_COUNT="$(
            gh pr list \
              --state open \
              --base "${GITHUB_REF_NAME}" \
              --head "${BRANCH}" \
              --limit 2 \
              --json number \
              --jq 'length'
          )"

          case "${PR_COUNT}" in
            0|1)
              ;;
            *)
              echo "::error::Found ${PR_COUNT} open pull requests for ${BRANCH}; expected at most one."
              exit 1
              ;;
          esac

          REMOTE_BRANCH_SHA="$(
            git ls-remote --heads origin "${REMOTE_BRANCH_REF}" |
              awk 'NR == 1 { print $1 }'
          )"

          if [[ -n "${REMOTE_BRANCH_SHA}" && ! "${REMOTE_BRANCH_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Git returned an invalid remote Formula branch SHA: ${REMOTE_BRANCH_SHA}"
            exit 1
          fi

          if [[ "${PR_COUNT}" = "1" && -z "${REMOTE_BRANCH_SHA}" ]]; then
            echo "::error::The open Formula pull request has no remote ${BRANCH} branch."
            exit 1
          fi

          FORMULA_CHANGED="false"
          if [ -n "$(git status --short -- Formula/atctl.rb)" ]; then
            FORMULA_CHANGED="true"
          fi

          git checkout -B "${BRANCH}"
          git add Formula/atctl.rb
          git commit \
            --allow-empty \
            -m "Update atctl formula to ${RELEASE_TAG}" \
            -m "Homebrew-Atctl-Publish-Bottles: ${PUBLISH_BOTTLES}" \
            -m "Homebrew-Atctl-Formula-Changed: ${FORMULA_CHANGED}" \
            -m "Homebrew-Atctl-Request: ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"

          PR_HEAD_SHA="$(git rev-parse HEAD)"
          if [[ ! "${PR_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Git returned an invalid new Formula commit SHA: ${PR_HEAD_SHA}"
            exit 1
          fi

          git push \
            --force-with-lease="${REMOTE_BRANCH_REF}:${REMOTE_BRANCH_SHA}" \
            origin \
            "${BRANCH}:${REMOTE_BRANCH_REF}"

          PR_BODY_FILE="$(mktemp)"
          trap 'rm -f "${PR_BODY_FILE}"' EXIT

          write_pr_body() {
            FORMULA_CHANGE_LABEL="No"
            if [[ "${FORMULA_CHANGED}" = "true" ]]; then
              FORMULA_CHANGE_LABEL="Yes"
            fi

            {
              if [[ "${FORMULA_CHANGED}" = "true" ]]; then
                echo "Updates \`Formula/atctl.rb\` for [uchimanajet7/atctl ${RELEASE_TAG}](https://github.com/uchimanajet7/atctl/releases/tag/${RELEASE_TAG}) using \`scripts/update-formula.rb\`."
              else
                echo "\`Formula/atctl.rb\` is already current for [uchimanajet7/atctl ${RELEASE_TAG}](https://github.com/uchimanajet7/atctl/releases/tag/${RELEASE_TAG}). This request has no file changes, but it has a new immutable head that must pass the same human workflow approval."
              fi
              echo
              echo "## Bottle publication"
              echo
              echo "Formula content changed: **${FORMULA_CHANGE_LABEL}**"
              echo
              if [[ "${FORMULA_CHANGED}" = "false" ]]; then
                echo "Inspect this head, select **Approve workflows to run**, and wait for **Formula CI**. After Formula CI succeeds, **Publish Bottles** records that there is no Formula change and completes successfully without publishing bottles, updating \`main\`, closing this pull request, or removing its Formula branch."
              elif [[ "${PUBLISH_BOTTLES}" = "true" ]]; then
                echo "Automatic bottle publication: **Enabled**"
                echo
                echo "Inspect this head, select **Approve workflows to run**, and wait for **Formula CI**. After Formula CI succeeds, **Publish Bottles** publishes the bottles, updates \`main\`, closes this pull request, and removes its Formula branch without another approval."
                echo
                echo "Do not manually merge this pull request before bottle publication."
              else
                echo "Automatic bottle publication: **Disabled**"
                echo
                echo "Inspect this head, select **Approve workflows to run**, and wait for **Formula CI**. After Formula CI succeeds, **Publish Bottles** records the disabled setting and completes successfully without publishing bottles, updating \`main\`, closing this pull request, or removing its Formula branch."
                echo
                echo "To request publication later, rerun **Update Formula PR** with the checkbox enabled. The rerun creates a new head that requires its own workflow approval."
              fi
              echo
              echo "Formula head: \`${PR_HEAD_SHA}\`"
              echo
              echo "This request does not reuse a previous workflow approval, Formula CI run, or bottle artifact."
            } >"${PR_BODY_FILE}"
          }

          write_pr_body

          case "${PR_COUNT}" in
            0)
              PR_URL="$(
                gh pr create \
                  --base "${GITHUB_REF_NAME}" \
                  --head "${BRANCH}" \
                  --title "Update atctl formula to ${RELEASE_TAG}" \
                  --body-file "${PR_BODY_FILE}"
              )"
              ;;
            1)
              PR_URL="$(
                gh pr list \
                  --state open \
                  --base "${GITHUB_REF_NAME}" \
                  --head "${BRANCH}" \
                  --limit 1 \
                  --json url \
                  --jq '.[0].url'
              )"
              ;;
          esac

          PR_HEAD_CONFIRMED="false"
          for _ in {1..30}; do
            if PR_DETAILS="$(
              gh pr view \
                "${PR_URL}" \
                --json baseRefName,body,headRefName,headRefOid,isDraft,state
            )"; then
              OBSERVED_HEAD_SHA="$(jq -r '.headRefOid // ""' <<<"${PR_DETAILS}")"
              if [[ "${OBSERVED_HEAD_SHA}" = "${PR_HEAD_SHA}" ]]; then
                PR_HEAD_CONFIRMED="true"
                break
              fi
            fi
            sleep 2
          done

          if [[ "${PR_HEAD_CONFIRMED}" != "true" ]]; then
            echo "::error::Pull request ${PR_URL} did not converge to head ${PR_HEAD_SHA}."
            exit 1
          fi

          if ! jq -e \
            --arg base_branch "${GITHUB_REF_NAME}" \
            --arg head_branch "${BRANCH}" \
            '
              .state == "OPEN" and
              .isDraft == false and
              .baseRefName == $base_branch and
              .headRefName == $head_branch
            ' <<<"${PR_DETAILS}" >/dev/null; then
            echo "::error::The pull request is not the expected open, non-draft ${BRANCH} pull request into ${GITHUB_REF_NAME}."
            exit 1
          fi

          gh pr edit "${PR_URL}" --body-file "${PR_BODY_FILE}"

          PR_BODY_CONFIRMED="false"
          for _ in {1..30}; do
            if PR_DETAILS="$(
              gh pr view \
                "${PR_URL}" \
                --json body,headRefOid
            )"; then
              OBSERVED_HEAD_SHA="$(jq -r '.headRefOid // ""' <<<"${PR_DETAILS}")"
              OBSERVED_BODY="$(jq -r '.body // ""' <<<"${PR_DETAILS}")"
              EXPECTED_BODY="$(cat "${PR_BODY_FILE}")"

              if [[ "${OBSERVED_HEAD_SHA}" = "${PR_HEAD_SHA}" && "${OBSERVED_BODY}" = "${EXPECTED_BODY}" ]]; then
                PR_BODY_CONFIRMED="true"
                break
              fi
            fi
            sleep 2
          done

          if [[ "${PR_BODY_CONFIRMED}" != "true" ]]; then
            echo "::error::Pull request ${PR_URL} did not retain head ${PR_HEAD_SHA} and the expected publication instructions."
            exit 1
          fi

          {
            echo "## Formula update pull request"
            echo
            echo "Pull request: ${PR_URL}"
            echo
            cat "${PR_BODY_FILE}"
          } >>"${GITHUB_STEP_SUMMARY}"
