name: Update Formula PR

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag from uchimanajet7/atctl, for example v0.1.0"
        required: true
        type: string
      publish_bottles:
        description: "Publish bottles after Formula CI succeeds"
        required: true
        default: true
        type: boolean

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  update-formula:
    runs-on: macos-26

    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # 2026.08.14.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update formula from release tag
        run: ruby scripts/update-formula.rb --tag "${{ inputs.tag }}"

      - name: Show formula changes
        run: |
          git status --short -- Formula/atctl.rb
          git diff -- Formula/atctl.rb

      - name: Check formula style
        run: brew style Formula/atctl.rb

      - name: Audit formula
        run: brew audit --strict --online atctl

      - name: Create or update formula pull request
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          PUBLISH_BOTTLES: ${{ inputs.publish_bottles }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          case "${PUBLISH_BOTTLES}" in
            true|false)
              ;;
            *)
              echo "::error::publish_bottles must be true or false."
              exit 1
              ;;
          esac

          if [[ "${GITHUB_REF}" != "refs/heads/${DEFAULT_BRANCH}" ]]; then
            echo "::error::Update Formula PR must run from the repository default branch ${DEFAULT_BRANCH}."
            exit 1
          fi

          if [[ ! "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Update Formula PR did not receive a full 40-character lowercase default-branch SHA."
            exit 1
          fi

          SAFE_TAG="${RELEASE_TAG//[^A-Za-z0-9._-]/-}"
          BRANCH="formula/${SAFE_TAG}"
          REMOTE_BRANCH_REF="refs/heads/${BRANCH}"
          FORMULA_HEAD_CHANGED="false"
          EXPECTED_PR_HEAD_SHA=""

          PR_COUNT="$(
            gh pr list \
              --state open \
              --base "${GITHUB_REF_NAME}" \
              --head "${BRANCH}" \
              --limit 2 \
              --json number \
              --jq 'length'
          )"

          case "${PR_COUNT}" in
            0|1)
              ;;
            *)
              echo "::error::Found ${PR_COUNT} open pull requests for ${BRANCH}; expected at most one."
              exit 1
              ;;
          esac

          REMOTE_BRANCH_SHA="$(
            git ls-remote --heads origin "${REMOTE_BRANCH_REF}" |
              awk 'NR == 1 { print $1 }'
          )"

          if [[ -n "${REMOTE_BRANCH_SHA}" && ! "${REMOTE_BRANCH_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Git returned an invalid remote Formula branch SHA: ${REMOTE_BRANCH_SHA}"
            exit 1
          fi

          if [ -n "$(git status --short -- Formula/atctl.rb)" ]; then
            GENERATED_FORMULA_BLOB="$(git hash-object Formula/atctl.rb)"
            REMOTE_FORMULA_BLOB=""
            REMOTE_PARENT_SHAS=""

            if [[ "${PR_COUNT}" = "1" ]]; then
              if [[ -z "${REMOTE_BRANCH_SHA}" ]]; then
                echo "::error::The open Formula pull request has no remote ${BRANCH} branch."
                exit 1
              fi

              git fetch --no-tags --depth=1 origin "${REMOTE_BRANCH_REF}"
              if git cat-file -e "${REMOTE_BRANCH_SHA}:Formula/atctl.rb" 2>/dev/null; then
                REMOTE_FORMULA_BLOB="$(git rev-parse "${REMOTE_BRANCH_SHA}:Formula/atctl.rb")"
              fi
              REMOTE_PARENT_SHAS="$(
                git cat-file -p "${REMOTE_BRANCH_SHA}" |
                  awk '$1 == "parent" { print $2 }'
              )"
            fi

            if [[
              "${PR_COUNT}" = "1" &&
              "${GENERATED_FORMULA_BLOB}" = "${REMOTE_FORMULA_BLOB}" &&
              "${REMOTE_PARENT_SHAS}" = "${GITHUB_SHA}"
            ]]; then
              EXPECTED_PR_HEAD_SHA="${REMOTE_BRANCH_SHA}"
            else
              FORMULA_HEAD_CHANGED="true"
              git checkout -B "${BRANCH}"
              git add Formula/atctl.rb
              git commit -m "Update atctl formula to ${RELEASE_TAG}"
              EXPECTED_PR_HEAD_SHA="$(git rev-parse HEAD)"

              if [[ ! "${EXPECTED_PR_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::Git returned an invalid new Formula commit SHA: ${EXPECTED_PR_HEAD_SHA}"
                exit 1
              fi

              git push \
                --force-with-lease="${REMOTE_BRANCH_REF}:${REMOTE_BRANCH_SHA}" \
                origin \
                "${BRANCH}:${REMOTE_BRANCH_REF}"
            fi
          elif [ "${PR_COUNT}" -eq 0 ]; then
            {
              echo "## Formula update"
              echo
              echo "\`Formula/atctl.rb\` is already up to date for ${RELEASE_TAG}; no open ${BRANCH} pull request requires synchronization."
            } >>"${GITHUB_STEP_SUMMARY}"
            exit 0
          else
            if [[ -z "${REMOTE_BRANCH_SHA}" ]]; then
              echo "::error::The open Formula pull request has no remote ${BRANCH} branch."
              exit 1
            fi
            EXPECTED_PR_HEAD_SHA="${REMOTE_BRANCH_SHA}"
          fi

          if [[ ! "${EXPECTED_PR_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The expected Formula pull request head is not a full 40-character lowercase SHA."
            exit 1
          fi

          INITIAL_PR_BODY_FILE="$(mktemp)"
          HANDOFF_FILE="$(mktemp)"
          PR_BODY_FILE="$(mktemp)"
          trap 'rm -f "${INITIAL_PR_BODY_FILE}" "${HANDOFF_FILE}" "${PR_BODY_FILE}"' EXIT

          {
            echo "Updates \`Formula/atctl.rb\` for [uchimanajet7/atctl ${RELEASE_TAG}](https://github.com/uchimanajet7/atctl/releases/tag/${RELEASE_TAG}) using \`scripts/update-formula.rb\`."
            echo
            echo "## Bottle publication"
            echo
            if [[ "${PUBLISH_BOTTLES}" = "true" ]]; then
              echo "Automatic bottle publication: **Enabled**"
            else
              echo "Automatic bottle publication: **Disabled**"
            fi
            echo
            echo "<!-- homebrew-atctl-publish-bottles=${PUBLISH_BOTTLES} head_sha=${EXPECTED_PR_HEAD_SHA} -->"
          } >"${INITIAL_PR_BODY_FILE}"

          case "${PR_COUNT}" in
            0)
              PR_URL="$(
                gh pr create \
                  --base "${GITHUB_REF_NAME}" \
                  --head "${BRANCH}" \
                  --title "Update atctl formula to ${RELEASE_TAG}" \
                  --body-file "${INITIAL_PR_BODY_FILE}"
              )"
              ;;
            1)
              PR_URL="$(
                gh pr list \
                  --state open \
                  --base "${GITHUB_REF_NAME}" \
                  --head "${BRANCH}" \
                  --limit 1 \
                  --json url \
                  --jq '.[0].url'
              )"
              ;;
            *)
              echo "::error::Found ${PR_COUNT} open pull requests for ${BRANCH}; expected at most one."
              exit 1
              ;;
          esac

          PR_DETAILS=""
          OBSERVED_PR_HEAD_SHA=""
          for _ in {1..30}; do
            if PR_DETAILS="$(
              gh pr view \
                "${PR_URL}" \
                --json baseRefName,body,headRefName,headRefOid,isDraft,number,state
            )"; then
              OBSERVED_PR_HEAD_SHA="$(jq -r '.headRefOid // ""' <<<"${PR_DETAILS}")"
              if [[ "${OBSERVED_PR_HEAD_SHA}" = "${EXPECTED_PR_HEAD_SHA}" ]]; then
                break
              fi
            fi
            sleep 2
          done

          if [[ "${OBSERVED_PR_HEAD_SHA}" != "${EXPECTED_PR_HEAD_SHA}" ]]; then
            echo "::error::Pull request ${PR_URL} did not converge to pushed head ${EXPECTED_PR_HEAD_SHA}; last observed ${OBSERVED_PR_HEAD_SHA:-none}."
            exit 1
          fi

          PR_NUMBER="$(jq -r '.number' <<<"${PR_DETAILS}")"
          PR_HEAD_SHA="${EXPECTED_PR_HEAD_SHA}"
          EXISTING_PR_BODY="$(jq -r '.body // ""' <<<"${PR_DETAILS}")"

          if [[ ! "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::GitHub returned an invalid pull request number: ${PR_NUMBER}"
            exit 1
          fi

          if [[ ! "${PR_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::GitHub returned an invalid pull request head SHA: ${PR_HEAD_SHA}"
            exit 1
          fi

          if ! jq -e \
            --arg base_branch "${GITHUB_REF_NAME}" \
            --arg head_branch "${BRANCH}" \
            '
              .state == "OPEN" and
              .isDraft == false and
              .baseRefName == $base_branch and
              .headRefName == $head_branch
            ' <<<"${PR_DETAILS}" >/dev/null; then
            echo "::error::The pull request is not the expected open, non-draft ${BRANCH} pull request into ${GITHUB_REF_NAME}."
            exit 1
          fi

          PREVIOUS_TRUE_MARKER="<!-- homebrew-atctl-publish-bottles=true head_sha=${PR_HEAD_SHA} -->"
          PREVIOUS_FALSE_MARKER="<!-- homebrew-atctl-publish-bottles=false head_sha=${PR_HEAD_SHA} -->"
          PREVIOUS_TRUE_COUNT="$(grep -Fxc -- "${PREVIOUS_TRUE_MARKER}" <<<"${EXISTING_PR_BODY}" || true)"
          PREVIOUS_FALSE_COUNT="$(grep -Fxc -- "${PREVIOUS_FALSE_MARKER}" <<<"${EXISTING_PR_BODY}" || true)"

          if (( PREVIOUS_TRUE_COUNT > 1 || PREVIOUS_FALSE_COUNT > 1 || (PREVIOUS_TRUE_COUNT == 1 && PREVIOUS_FALSE_COUNT == 1) )); then
            echo "::error::The existing Formula PR contains an ambiguous publication marker for ${PR_HEAD_SHA}."
            exit 1
          fi

          REUSE_EXISTING_HEAD="false"
          if [[ "${PUBLISH_BOTTLES}" = "true" && "${FORMULA_HEAD_CHANGED}" = "false" ]]; then
            REUSE_EXISTING_HEAD="true"
          fi

          PUBLISH_URL="https://github.com/${GITHUB_REPOSITORY}/actions/workflows/publish-bottles.yml"

          {
            echo "## Bottle publication"
            echo
            if [ "${PUBLISH_BOTTLES}" = "true" ]; then
              echo "Automatic bottle publication: **Enabled**"
              echo
              echo "After **Formula CI** succeeds for this exact head, it explicitly requests **Publish Bottles**, which waits for approval in the \`homebrew-publication\` environment. Review that deployment and select **Approve and deploy** to publish the bottles and update \`main\`."
              echo
              echo "If this exact head already passed **Formula CI** while publication was disabled, rerunning **Update Formula PR** with this setting enabled reuses that successful CI run and requests **Publish Bottles** immediately."
              echo
              echo "Do not manually merge this pull request before bottle publication."
            else
              echo "Automatic bottle publication: **Disabled**"
              echo
              echo "After **Formula CI** succeeds, it does not start **Publish Bottles**. No publication approval is requested and no bottles or \`main\` update are published. Merge this pull request manually if bottles are intentionally not required, or use the manual workflow below to publish later."
            fi
            echo
            echo "If GitHub shows **Approve workflows to run**, approve it and wait for **Formula CI** to succeed. This approval only allows CI to run; it does not publish bottles or merge this pull request."
            echo
            echo "### Manual Publish Bottles inputs"
            echo
            echo "The manual workflow remains available independently of the automatic setting. It uses the same publication approval and exact-head validation."
            echo
            echo "| Publish Bottles input | Value |"
            echo "| --- | --- |"
            echo "| \`pull_request\` | \`${PR_NUMBER}\` |"
            echo "| \`head_sha\` | \`${PR_HEAD_SHA}\` |"
            echo
            echo "[Open Publish Bottles](${PUBLISH_URL})"
            echo
            echo "If the pull request head changes, review the new commit and rerun **Update Formula PR** to refresh this handoff. Publication is rejected unless the current pull request head and the reviewed \`brew pr-pull --head-sha\` value still match."
            echo
            echo "<!-- homebrew-atctl-publish-bottles=${PUBLISH_BOTTLES} head_sha=${PR_HEAD_SHA} -->"
          } >"${HANDOFF_FILE}"

          {
            echo "Updates \`Formula/atctl.rb\` for [uchimanajet7/atctl ${RELEASE_TAG}](https://github.com/uchimanajet7/atctl/releases/tag/${RELEASE_TAG}) using \`scripts/update-formula.rb\`."
            echo
            cat "${HANDOFF_FILE}"
          } >"${PR_BODY_FILE}"

          gh pr edit "${PR_URL}" --body-file "${PR_BODY_FILE}"

          EXPECTED_MARKER="<!-- homebrew-atctl-publish-bottles=${PUBLISH_BOTTLES} head_sha=${PR_HEAD_SHA} -->"
          if [[ "${PUBLISH_BOTTLES}" = "true" ]]; then
            OPPOSITE_MARKER="<!-- homebrew-atctl-publish-bottles=false head_sha=${PR_HEAD_SHA} -->"
          else
            OPPOSITE_MARKER="<!-- homebrew-atctl-publish-bottles=true head_sha=${PR_HEAD_SHA} -->"
          fi

          PR_BODY_CONFIRMED="false"
          for _ in {1..30}; do
            if CONFIRMED_PR_DETAILS="$(gh pr view "${PR_URL}" --json body,headRefOid)"; then
              CONFIRMED_HEAD_SHA="$(jq -r '.headRefOid // ""' <<<"${CONFIRMED_PR_DETAILS}")"
              CONFIRMED_BODY="$(jq -r '.body // ""' <<<"${CONFIRMED_PR_DETAILS}")"
              EXPECTED_MARKER_COUNT="$(grep -Fxc -- "${EXPECTED_MARKER}" <<<"${CONFIRMED_BODY}" || true)"
              OPPOSITE_MARKER_COUNT="$(grep -Fxc -- "${OPPOSITE_MARKER}" <<<"${CONFIRMED_BODY}" || true)"

              if [[ "${CONFIRMED_HEAD_SHA}" = "${PR_HEAD_SHA}" && "${EXPECTED_MARKER_COUNT}" = "1" && "${OPPOSITE_MARKER_COUNT}" = "0" ]]; then
                PR_BODY_CONFIRMED="true"
                break
              fi
            fi
            sleep 2
          done

          if [[ "${PR_BODY_CONFIRMED}" != "true" ]]; then
            echo "::error::Pull request ${PR_URL} did not expose exactly one ${PUBLISH_BOTTLES} publication marker for ${PR_HEAD_SHA}."
            exit 1
          fi

          CATCH_UP_STATUS="not-needed"
          FORMULA_CI_RUN_ID=""
          if [[ "${REUSE_EXISTING_HEAD}" = "true" ]]; then
            CI_RUNS_JSON="$(
              gh api \
                --method GET \
                "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
                -f event=pull_request \
                -f head_sha="${PR_HEAD_SHA}" \
                -f status=success \
                -F per_page=100
            )"

            FORMULA_CI_RUN_ID="$(
              jq -r \
                --arg head_branch "${BRANCH}" \
                --arg head_sha "${PR_HEAD_SHA}" \
                --arg repository "${GITHUB_REPOSITORY}" \
                --argjson pull_request "${PR_NUMBER}" \
                '
                  [
                    .workflow_runs[]?
                    | select(
                        .name == "Formula CI" and
                        ((.path // "" | split("@")[0]) == ".github/workflows/ci.yml") and
                        .event == "pull_request" and
                        .status == "completed" and
                        .conclusion == "success" and
                        .head_branch == $head_branch and
                        .head_sha == $head_sha and
                        .head_repository.full_name == $repository and
                        .actor.login == "github-actions[bot]" and
                        any(.pull_requests[]?; .number == $pull_request)
                      )
                  ]
                  | sort_by(.updated_at)
                  | last
                  | .id // empty
                ' <<<"${CI_RUNS_JSON}"
            )"

            if [[ -z "${FORMULA_CI_RUN_ID}" ]]; then
              CATCH_UP_STATUS="ci-required"
            elif [[ ! "${FORMULA_CI_RUN_ID}" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::GitHub returned an invalid Formula CI run ID: ${FORMULA_CI_RUN_ID}"
              exit 1
            else
              ARTIFACTS_JSON="$(
                gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${FORMULA_CI_RUN_ID}/artifacts?per_page=100"
              )"

              if ! jq -e \
                --arg head_sha "${PR_HEAD_SHA}" \
                '
                  any(
                    .artifacts[]?;
                    .name == "bottles_macos-26" and
                    .expired == false and
                    .size_in_bytes > 0 and
                    .workflow_run.head_sha == $head_sha
                  )
                ' <<<"${ARTIFACTS_JSON}" >/dev/null; then
                echo "::error::Formula CI run ${FORMULA_CI_RUN_ID} has no usable bottles_macos-26 artifact for ${PR_HEAD_SHA}; rerun Formula CI before publishing."
                exit 1
              fi

              DISPATCH_PAYLOAD="$(
                jq -cn \
                  --arg head_sha "${PR_HEAD_SHA}" \
                  --argjson formula_ci_run_id "${FORMULA_CI_RUN_ID}" \
                  --argjson pull_request "${PR_NUMBER}" \
                  '{
                    event_type: "publish-bottles",
                    client_payload: {
                      pull_request: $pull_request,
                      head_sha: $head_sha,
                      formula_ci_run_id: $formula_ci_run_id
                    }
                  }'
              )"

              gh api \
                --method POST \
                "/repos/${GITHUB_REPOSITORY}/dispatches" \
                --input - <<<"${DISPATCH_PAYLOAD}"
              CATCH_UP_STATUS="requested"
            fi
          fi

          {
            echo "## Formula update pull request"
            echo
            echo "Pull request: ${PR_URL}"
            echo
            cat "${HANDOFF_FILE}"
            if [[ "${CATCH_UP_STATUS}" = "requested" ]]; then
              echo
              echo "Reused successful Formula CI run https://github.com/${GITHUB_REPOSITORY}/actions/runs/${FORMULA_CI_RUN_ID} and requested **Publish Bottles**."
            elif [[ "${CATCH_UP_STATUS}" = "ci-required" ]]; then
              echo
              echo "No successful Formula CI run was found for this exact head. Run or rerun **Formula CI**; after it succeeds, its publication-request job will start **Publish Bottles**."
            fi
          } >>"${GITHUB_STEP_SUMMARY}"
